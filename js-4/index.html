<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body>
    <div class="container">
      <input type="text" placeholder="00" id="result" aria-label="result" />
      <div id="arry">
        <div class="fisrt">
          <button value="1">1</button>
          <button value="2">2</button>
          <button value="3">3</button>
          <button value="+">+</button>
        </div>
        <div class="second">
          <button value="4">4</button>
          <button value="5">5</button>
          <button value="6">6</button>
          <button value="-">-</button>
        </div>
        <div class="third">
          <button value="7">7</button>
          <button value="8">8</button>
          <button value="9">9</button>
          <button value="*">*</button>
        </div>
        <div class="fouth">
          <button value="0">0</button>
          <button value="Ac">Ac</button>
          <button value="Cc">Cc</button>
          <button value="/">/</button>
        </div>
      </div>
    </div>
    <script>
        const result = document.getElementById("result");
        const arry = document.getElementById("arry");

      arry.addEventListener("click",function(event){
        const val = event.target.value;
        if (val === "Ac") {
            val.result = "";
            else(val == "Cc")(
                slice(val -1)
                slice.value = result.textContent

            )
        }
      });
    </script>
  </body>
</html>
